<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>Loan Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loan Tracker">
<meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" id="apple-touch-icon" sizes="180x180" href="">
<script>
(function(){
  var c=document.createElement('canvas');c.width=180;c.height=180;
  var ctx=c.getContext('2d'),r=36;

  // Rounded rect clip for entire icon
  function roundRect(x,y,w,h,rad){
    ctx.beginPath();
    ctx.moveTo(x+rad,y);ctx.lineTo(x+w-rad,y);ctx.quadraticCurveTo(x+w,y,x+w,y+rad);
    ctx.lineTo(x+w,y+h-rad);ctx.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
    ctx.lineTo(x+rad,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-rad);
    ctx.lineTo(x,y+rad);ctx.quadraticCurveTo(x,y,x+rad,y);
    ctx.closePath();
  }

  // Clip everything to rounded square
  roundRect(0,0,180,180,r);
  ctx.clip();

  // Dark top background
  ctx.fillStyle='#0f172a';
  ctx.fillRect(0,0,180,180);

  // Blue bottom band
  ctx.fillStyle='#2563EB';
  ctx.fillRect(0,102,180,78);

  // Subtle divider line
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.fillRect(0,100,180,3);

  // "EMI" — large bold white on dark top
  ctx.fillStyle='#ffffff';
  ctx.font='800 58px -apple-system,Arial,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('EMI',90,62);

  // Small label "TRACKER" below EMI
  ctx.fillStyle='rgba(255,255,255,0.38)';
  ctx.font='600 13px -apple-system,Arial,sans-serif';
  ctx.letterSpacing='3px';
  ctx.fillText('TRACKER',90,90);

  // Bottom band: ₹ symbol + wavy underline feel
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='700 22px -apple-system,Arial,sans-serif';
  ctx.fillText('₹ Loan Calculator',90,130);

  // Small dots pattern for texture on blue band
  ctx.fillStyle='rgba(255,255,255,0.12)';
  for(var i=0;i<6;i++){
    ctx.beginPath();
    ctx.arc(18+i*26,158,3,0,Math.PI*2);
    ctx.fill();
  }

  var d=c.toDataURL('image/png');
  document.getElementById('apple-touch-icon').href=d;
  var f=document.createElement('link');f.rel='icon';f.type='image/png';f.href=d;
  document.head.appendChild(f);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0d0d10;--surface:#141417;--surface2:#1e1e25;--surface3:#26262f;--border:#4a4a60;--border2:#383850;--scrim:rgba(0,0,0,0.72);--text1:#f4f4fa;--text2:#c8c8e0;--text3:#b0b0cc;--green:#22c55e;--green-bg:rgba(34,197,94,0.1);--red:#f87171;--red-bg:rgba(248,113,113,0.1);--blue:#3B82F6;--accent2:rgba(255,255,255,0.06);--nav-h:60px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--r:12px;--r-lg:16px;--r-xl:20px;--ease:cubic-bezier(0.16,1,0.3,1);--spring:cubic-bezier(0.34,1.56,0.64,1)}
[data-theme="light"]{--bg:#f2f2f7;--surface:#ffffff;--surface2:#f5f5fa;--surface3:#e8e8f0;--border:#c8c8d8;--border2:#d8d8e4;--text1:#1a1a25;--text2:#505068;--text3:#808098;--accent2:rgba(0,0,0,0.04);--scrim:rgba(0,0,0,0.45);--blue:#2563EB;--green:#16a34a;--green-bg:rgba(22,163,74,0.08);--red:#dc2626;--red-bg:rgba(220,38,38,0.06)}
[data-theme="light"] .top-header{background:var(--bg);border-bottom:1px solid var(--border)}
[data-theme="light"] .tab-bar{background:var(--bg);border-top:1px solid var(--border)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow-x:hidden;background:var(--bg)}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;max-width:100vw;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 4px);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}
.top-header{position:sticky;top:0;z-index:90;background:rgba(13,13,16,0.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:calc(12px + var(--safe-t)) 20px 10px}
.hdr-title{font-size:1.1rem;font-weight:800}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;justify-content:center;height:var(--nav-h);padding-bottom:var(--safe-b);background:rgba(13,13,16,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border2)}
.tab-bar-inner{width:100%;max-width:480px;display:flex;align-items:flex-start;justify-content:space-around}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:8px 0 0;background:none;border:none;color:var(--text3);transition:color 120ms;font-family:inherit}
.tab-item.active{color:var(--blue)}
.tab-icon{height:26px;display:flex;align-items:center;justify-content:center}
.tab-icon svg{width:1.3rem;height:1.3rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:0.35;transition:opacity 200ms}
.tab-item.active .tab-icon svg{opacity:1;stroke:var(--blue)}
.tab-label{font-size:0.68rem;font-weight:700;letter-spacing:0.2px}
.container{padding:0 16px}.page{display:none}.page.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:14px 16px;margin-bottom:10px}
.sec-hdr-card{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;user-select:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:8px}
.sec-hdr-card:active{background:var(--surface3)}
.sec-hdr-left{display:flex;align-items:center;gap:8px;min-width:0}
.sec-hdr-title{font-size:0.86rem;font-weight:600;color:var(--text1);display:inline-flex;align-items:center;gap:8px}
.sec-caret{color:var(--text3);transition:transform 0.25s var(--ease);display:flex;align-items:center}
.sec-caret svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sec-caret.open{transform:rotate(180deg)}
.sec-body{overflow:hidden;max-height:5000px;transition:max-height 0.32s var(--ease),opacity 0.2s ease;opacity:1}
.sec-body.closed{max-height:0;opacity:0;pointer-events:none}
.fg{margin-bottom:13px}
.fl{font-size:0.68rem;font-weight:700;color:var(--text3);letter-spacing:0;margin-bottom:5px;display:block}
.fi{width:100%;max-width:100%;font-size:1rem;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font-family:'Inter',sans-serif;font-weight:500;background:var(--surface2);color:var(--text1);outline:none;-webkit-appearance:none;transition:border-color 150ms,box-shadow 150ms;box-sizing:border-box}
.fi:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,0.12);background:var(--surface)}
.fi::placeholder{color:var(--text3)}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
@media(max-width:340px){.form-row2{grid-template-columns:1fr}}
.form-row2 .fg{display:flex;flex-direction:column}.form-row2 .fg .fi{flex:1;min-height:44px}
/* EMI Hero */
.result-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r);padding:16px 16px 14px;margin-top:10px}
.result-label{font-size:0.6rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px}
.result-val{font-size:2rem;font-weight:800;color:var(--text1);letter-spacing:-0.5px;line-height:1}
.result-sub{font-size:0.72rem;color:var(--text3);margin-top:6px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border2)}
.result-row:last-child{border-bottom:none}
.result-row-label{font-size:0.78rem;color:var(--text2)}
.result-row-val{font-size:0.82rem;font-weight:700;color:var(--text1)}
/* Amortization */
.yr-table-wrap{margin-top:10px}
.yr-toggle{display:flex;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--blue);font-size:0.72rem;font-weight:700;cursor:pointer;padding:8px 12px;font-family:inherit;width:100%}
.yr-toggle svg{width:10px;height:10px;transition:transform 0.2s ease}
.yr-body.closed{display:none}
.yr-cards{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-top:4px}
.yr-hdr{display:grid;grid-template-columns:36px 1fr 1fr 1fr;background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 12px;gap:8px}
.yr-hdr-cell{font-size:0.58rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.3px;text-align:right}
.yr-hdr-cell:first-child{text-align:left}
.yr-row{display:grid;grid-template-columns:36px 1fr 1fr 1fr;padding:11px 12px;gap:8px;border-bottom:1px solid var(--border2);align-items:center}
.yr-row:last-child{border-bottom:none}
.yr-row:nth-child(even){background:var(--surface2)}
.yr-cell{font-size:0.78rem;font-weight:600;color:var(--text1);text-align:right;white-space:nowrap}
.yr-cell:first-child{color:var(--text3);font-weight:700;text-align:left;font-size:0.82rem}
/* Part payments */
.pp-list{margin-top:4px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.pp-item{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border2);background:transparent}
.pp-item:last-child{border-bottom:none}
.pp-info{flex:1;min-width:0}
.pp-amt{font-size:0.88rem;font-weight:700;color:var(--text1)}
.pp-meta{font-size:0.68rem;color:var(--text3);margin-top:3px}
.pp-outstanding{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border2)}
.pp-outstanding-label{font-size:0.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px}
.pp-outstanding-val{font-size:0.82rem;font-weight:800;color:var(--text1)}
.pp-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.pp-edit{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);color:var(--blue);cursor:pointer;border-radius:8px;padding:0;transition:background 120ms}
.pp-edit:active{background:var(--surface3)}
.pp-edit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pp-del{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--red-bg);border:1px solid rgba(248,113,113,0.25);color:var(--red);cursor:pointer;border-radius:8px;padding:0;transition:background 120ms}
.pp-del:active{background:rgba(248,113,113,0.2)}
.pp-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pp-edit-form{margin:0;padding:12px 14px;background:var(--surface2);border-top:1px solid var(--border2)}
/* Font size */
.fs-btn{padding:8px 4px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:'Inter',sans-serif;font-size:0.78rem;font-weight:700;cursor:pointer;transition:all 150ms var(--ease)}
.fs-btn:active{transform:scale(0.93)}
.fs-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.range-wrap{position:relative;width:100%;height:22px;display:flex;align-items:center}
.range-track{position:absolute;left:0;right:0;height:4px;background:var(--surface3);border-radius:99px;top:50%;transform:translateY(-50%)}
.range-fill{position:absolute;left:0;height:100%;background:var(--blue);border-radius:99px;transition:width .1s}
input[type=range].custom-range{position:relative;width:100%;height:22px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;margin:0;z-index:1;padding:0;outline:none}
input[type=range].custom-range::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 6px rgba(0,0,0,.35);transition:transform .1s;margin-top:-9px}
input[type=range].custom-range:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range].custom-range::-webkit-slider-runnable-track{background:transparent;height:4px}
.btn{padding:10px 16px;border-radius:var(--r);font-size:0.88rem;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:opacity 0.15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text2)}
.radio-pills{display:flex;gap:6px;margin-bottom:13px}
.radio-pill{flex:1;padding:9px 0;border-radius:var(--r);border:1px solid var(--border2);background:var(--surface2);color:var(--text3);font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;transition:all 0.15s}
.radio-pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.info-note{display:flex;align-items:flex-start;gap:5px;padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--border2)}
.info-note span{font-size:0.62rem;color:var(--text3);line-height:1.5}
.toggle{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--surface3);border:1px solid var(--border);border-radius:99px;transition:0.2s}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;left:2px;bottom:2px;background:var(--text3);border-radius:50%;transition:0.2s}
.toggle input:checked+.toggle-slider{background:var(--blue);border-color:var(--blue)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px);background:#fff}
/* Date picker — adapted from reference app style */
.cal-wrap{position:relative}
.cal-display{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text1);font-family:'Inter',sans-serif;font-size:1rem;font-weight:500;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color 150ms;user-select:none}
.cal-display.empty{color:var(--text3)}
.cal-display svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:0.6}
.cal-popup{margin-top:6px;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;animation:calIn 0.15s var(--ease) both}
@keyframes calIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border2)}
.cal-nav-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:background 120ms;font-size:0.82rem;flex-shrink:0;font-family:inherit}
.cal-nav-btn:active{background:var(--surface3)}
.cal-yr-label{font-size:0.88rem;font-weight:700;color:var(--text1);cursor:pointer;padding:3px 8px;border-radius:6px;transition:background 120ms}
.cal-yr-label:active{background:var(--surface2)}
.cal-months{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px}
.cal-mo{padding:8px 4px;border-radius:8px;text-align:center;font-size:0.8rem;font-weight:600;cursor:pointer;color:var(--text2);background:var(--surface2);border:1.5px solid transparent;transition:all 120ms}
.cal-mo:active{background:var(--surface3)}
.cal-mo.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.cal-mo.cur{border-color:var(--blue);color:var(--blue)}
.cal-yr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:8px;max-height:140px;overflow-y:auto}
.cal-yr-item{padding:6px 2px;border-radius:6px;text-align:center;font-size:0.76rem;font-weight:600;cursor:pointer;color:var(--text2);transition:background 100ms}
.cal-yr-item:active{background:var(--surface2);color:var(--text1)}
.cal-yr-item.sel{background:var(--text1);color:var(--bg)}
.cal-clear{padding:8px;border-top:1px solid var(--border2);text-align:center;font-size:0.74rem;color:var(--text3);cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;font-family:inherit;width:100%;transition:color 120ms}
.cal-clear:active{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;padding:4px 5px}
.cal-dow{font-size:0.56rem;font-weight:700;color:var(--text3);text-align:center;padding:3px 0 2px}
.cal-day{width:100%;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:500;cursor:pointer;color:var(--text1);transition:background 100ms}
.cal-day:not(.cal-empty):active{background:var(--surface2)}
.cal-day.cal-today{color:var(--green);font-weight:700}
.cal-day.cal-sel{background:var(--blue)!important;color:#fff;font-weight:700;border-radius:8px}
.cal-day.cal-other{color:var(--text3)}
.cal-day.cal-empty{cursor:default}
</style>
</head>
<body data-theme="dark">
<div class="top-header"><div class="hdr-title">Loan Tracker</div></div>

<div class="page active" id="page-personal"><div class="container" style="padding-top:8px">
  <div class="card" id="pl-form-card"></div>
  <div id="pl-results-card"></div>
</div></div>

<div class="page" id="page-home"><div class="container" style="padding-top:8px">
  <div class="card" id="hl-form-card"></div>
  <div id="hl-results-card"></div>
</div></div>

<div class="page" id="page-settings"><div class="container" style="padding-top:8px">
  <div class="sec-hdr-card" onclick="toggleSec('sec-appear')"><div class="sec-hdr-left"><span class="sec-hdr-title">Appearance</span></div><span class="sec-caret" id="caret-sec-appear"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span></div>
  <div class="sec-body closed" id="sec-appear"><div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 0 10px;border-bottom:1px solid var(--border2);margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg><span style="font-size:0.88rem;font-weight:600">Dark Mode</span></div>
      <label class="toggle"><input type="checkbox" id="theme-toggle" onchange="toggleTheme(this.checked)"/><span class="toggle-slider"></span></label>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span style="font-size:0.88rem;font-weight:600">Text Size</span></div>
    <div style="font-size:0.7rem;color:var(--text3);margin-bottom:10px">Adjust app font size</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
      <button onclick="setFontSize(13)" class="fs-btn" data-size="13">XS</button>
      <button onclick="setFontSize(14)" class="fs-btn" data-size="14">S</button>
      <button onclick="setFontSize(16)" class="fs-btn active" data-size="16">M</button>
      <button onclick="setFontSize(18)" class="fs-btn" data-size="18">L</button>
      <button onclick="setFontSize(20)" class="fs-btn" data-size="20">XL</button>
    </div>
    <div style="margin-top:10px">
      <div class="range-wrap">
        <div class="range-track"><div class="range-fill" id="range-fill" style="width:50%"></div></div>
        <input type="range" class="custom-range" id="font-size-bar" min="0" max="4" step="1" value="2"
          oninput="const s=[13,14,16,18,20];setFontSize(s[this.value]);updateRangeFill(+this.value)"/>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:4px">
      <span style="font-size:0.6rem;color:var(--text3)">Smaller</span>
      <span style="font-size:0.6rem;color:var(--text3)">Larger</span>
    </div>
  </div></div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:0.86rem;font-weight:600;color:var(--text1)">Clear All Data</div>
        <div style="font-size:0.7rem;color:var(--text3);margin-top:2px">Reset both loans to defaults</div>
      </div>
      <button onclick="clearAllData()" style="padding:7px 14px;border-radius:var(--r);border:1px solid rgba(248,113,113,0.35);background:var(--red-bg);color:var(--red);font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit">Clear</button>
    </div>
  </div>
  <div style="text-align:center;padding:16px 0;font-size:0.72rem;color:var(--text3)">Data stored on your device only 🔒</div>
</div></div>

  <button class="tab-item active" onclick="nav('personal',this)"><div class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg></div><div class="tab-label">Personal</div></button>

<script>
const LS_KEY='loan_tracker_v1';
let data={personal:{amount:0,rate:0,tenure:0,partPayments:[]},home:{amount:0,rate:0,tenure:0,partPayments:[]}};

// fmt: compact for summary rows (e.g. ₹53.4K, ₹2.48L)
function fmt(n){const v=Math.abs(Number(n)||0);let s='';if(v>=10000000)s=(v/10000000).toFixed(2)+'Cr';else if(v>=100000)s=(v/100000).toFixed(2)+'L';else if(v>=1000)s=(v/1000).toFixed(1)+'K';else s=v.toFixed(0);return(n<0?'-':'')+'₹'+s}
// fmtFull: exact rupee amount with commas for EMI hero (e.g. ₹53,433)
function fmtFull(n){const v=Math.round(Math.abs(Number(n)||0));const s=v.toLocaleString('en-IN');return(n<0?'-':'')+'₹'+s}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(data))}
function load(){try{const d=JSON.parse(localStorage.getItem(LS_KEY));if(d){data=d}}catch(e){}}

function nav(p,btn){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(p==='personal'||p==='home')renderLoan(p);
}
function toggleSec(id){const el=document.getElementById(id);if(!el)return;const c=el.classList.toggle('closed');document.getElementById('caret-'+id)?.classList.toggle('open',!c)}
function toggleYr(btn,id){const b=document.getElementById(id);b.classList.toggle('closed');const o=!b.classList.contains('closed');const t=btn.querySelector('span').textContent.replace('Hide ','');btn.querySelector('span').textContent=o?'Hide '+t:t;btn.querySelector('svg').style.transform=o?'rotate(180deg)':''}
function toggleTheme(d){document.body.setAttribute('data-theme',d?'dark':'light');localStorage.setItem('loan_theme',d?'dark':'light')}
const FS_IDX={13:0,14:1,16:2,18:3,20:4};
function updateRangeFill(idx){const f=document.getElementById('range-fill');if(f)f.style.width=(idx/4*100)+'%';}
function setFontSize(px){
  document.documentElement.style.fontSize=px+'px';
  localStorage.setItem('loan_fs',px);
  const bar=document.getElementById('font-size-bar');
  if(bar){bar.value=FS_IDX[px]??2;updateRangeFill(FS_IDX[px]??2);}
  document.querySelectorAll('.fs-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.size)===px));
}
function clearAllData(){
  if(!confirm('Reset both loans to defaults? This cannot be undone.'))return;
  // Reset data
  data={personal:{amount:0,rate:0,tenure:0,startDate:'',partPayments:[]},home:{amount:0,rate:0,tenure:0,startDate:'',partPayments:[]}};
  save();
  // Fully destroy and rebuild both form cards so inputs clear
  ['pl','hl'].forEach(prefix=>{
    const fc=document.getElementById(prefix+'-form-card');
    if(fc){fc.innerHTML='';delete fc.dataset.built;}
    const rc=document.getElementById(prefix+'-results-card');
    if(rc)rc.innerHTML='';
  });
  renderLoan('personal');
  renderLoan('home');
}

function emiCalc(P,annualRate,months){const r=annualRate/12;if(r===0)return P/months;return P*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1)}

function parseStartDate(startDate){
  if(!startDate)return null;
  // Support both DD-MM-YYYY and YYYY-MM formats
  if(startDate.includes('-')&&startDate.length===10){
    const[dd,mm,yyyy]=startDate.split('-');
    return new Date(parseInt(yyyy),parseInt(mm)-1,parseInt(dd));
  }
  return new Date(startDate+'T00:00:00');
}
function monthLabel(startDate,monthOffset){
  if(!startDate)return null;
  const d=parseStartDate(startDate);
  if(!d)return null;
  d.setMonth(d.getMonth()+monthOffset);
  // Show exact EMI date: "14 Feb 2026"
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function balanceAtMonth(type,targetMonth){
  const d=data[type];
  const P=Number(d.amount||0),annualRate=Number(d.rate||0)/100,tenure=Number(d.tenure||0);
  if(!P||!annualRate||!tenure)return 0;
  const r=annualRate/12;
  const emi=emiCalc(P,annualRate,tenure);
  let bal=P;
  for(let m=1;m<targetMonth&&bal>0;m++){
    const intPart=bal*r,prinPart=Math.min(bal,emi-intPart);
    bal-=prinPart;
  }
  return Math.max(0,bal);
}

// Balance AFTER targetMonth's EMI has been paid, including existing part payments
// This matches the amortization loop's balBefore (balance after EMI, before PP)
function balanceAtMonthWithPP(type,targetMonth,excludeId){
  const d=data[type];
  const P=Number(d.amount||0),annualRate=Number(d.rate||0)/100,tenure=Number(d.tenure||0);
  if(!P||!annualRate||!tenure)return 0;
  const r=annualRate/12;
  const emi=emiCalc(P,annualRate,tenure);
  const ppSorted=[...d.partPayments]
    .filter(p=>p.id!==excludeId)
    .sort((a,b)=>a.month-b.month);
  let bal=P,curEmi=emi;
  for(let m=1;m<=targetMonth&&bal>0;m++){
    const intPart=bal*r,prinPart=Math.min(bal,curEmi-intPart);
    bal-=prinPart;
    // Apply any part payments at this month (but only before targetMonth — at targetMonth we want balance after EMI, before PP)
    if(m<targetMonth){
      ppSorted.filter(p=>p.month===m).forEach(p=>{
        const ppAmt=Math.min(p.amount,bal);
        bal-=ppAmt;
        if(p.strategy==='reduce-emi'&&bal>0){const rm=tenure-m;if(rm>0)curEmi=emiCalc(bal,annualRate,rm);}
      });
    }
  }
  return Math.max(0,bal);
}

function renderForm(type){
  const d=data[type];
  const prefix=type==='personal'?'pl':'hl';
  const fc=document.getElementById(prefix+'-form-card');
  if(!fc||fc.dataset.built)return;
  fc.dataset.built='1';
  fc.innerHTML=`
    <div class="fg"><label class="fl">Loan Amount (₹)</label>
      <input class="fi" id="${prefix}-amt" type="number" inputmode="numeric" placeholder="e.g. ${type==='personal'?'500000':'5000000'}" value="${d.amount||''}" oninput="onField('${type}','amount',this)"/>
    </div>
    <div class="form-row2">
      <div class="fg"><label class="fl">Interest Rate (% p.a.)</label>
        <input class="fi" id="${prefix}-rate" type="number" inputmode="decimal" step="0.01" placeholder="${type==='personal'?'12':'8.5'}" value="${d.rate||''}" oninput="onField('${type}','rate',this)"/>
      </div>
      <div class="fg"><label class="fl">Tenure (months)</label>
        <input class="fi" id="${prefix}-tenure" type="number" inputmode="numeric" placeholder="${type==='personal'?'36':'240'}" value="${d.tenure||''}" oninput="onField('${type}','tenure',this)"/>
      </div>
    </div>
    <div class="fg" style="margin-bottom:0"><label class="fl">First EMI Date <span style="font-weight:400;color:var(--text3)">(optional · for progress tracking)</span></label>
      <div class="cal-wrap" id="${prefix}-cal-wrap">
        <div class="cal-display ${d.startDate?'':'empty'}" id="${prefix}-cal-display" onclick="toggleCal('${prefix}')">
          <span>${d.startDate?formatCalLabel(d.startDate):'Select date'}</span>
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="cal-popup" id="${prefix}-cal-popup" style="display:none"></div>
      </div>
    </div>`;
}

function onField(type,field,el){
  if(field==='startDate') data[type][field]=el.value||'';
  else if(field==='rate') data[type][field]=parseFloat(el.value)||0;
  else data[type][field]=Number(el.value)||0;
  save();renderResults(type);
}
const MOS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
const _lc={id:'',year:new Date().getFullYear(),month:new Date().getMonth(),viewMode:'days',sel:null};

function formatCalLabel(val){
  if(!val)return'Select date';
  const d=parseStartDate(val);
  if(!d)return val;
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function toggleCal(prefix){
  const popup=document.getElementById(prefix+'-cal-popup');
  if(!popup)return;
  const isOpen=popup.style.display!=='none';
  document.querySelectorAll('.cal-popup').forEach(p=>p.style.display='none');
  if(!isOpen){
    const type=prefix==='pl'?'personal':'home';
    const sd=data[type].startDate;
    _lc.id=prefix;
    _lc.viewMode='days';
    if(sd){
      const d=parseStartDate(sd);
      _lc.year=d.getFullYear();_lc.month=d.getMonth();
      _lc.sel=sd;
    } else {
      const now=new Date();
      _lc.year=now.getFullYear();_lc.month=now.getMonth();_lc.sel=null;
    }
    popup.style.display='block';
    renderCalPopup();
  }
}
function renderCalPopup(){
  const popup=document.getElementById(_lc.id+'-cal-popup');
  if(!popup)return;
  if(_lc.viewMode==='years'){renderCalYears();return;}
  const today=new Date();
  const firstDay=new Date(_lc.year,_lc.month,1).getDay();
  const daysInMonth=new Date(_lc.year,_lc.month+1,0).getDate();
  const daysInPrev=new Date(_lc.year,_lc.month,0).getDate();
  const selD=_lc.sel?parseStartDate(_lc.sel):null;
  let cells='';
  // Prev month tail
  for(let i=firstDay-1;i>=0;i--)cells+=`<div class="cal-day cal-other cal-empty">${daysInPrev-i}</div>`;
  // Current month
  for(let d=1;d<=daysInMonth;d++){
    const isToday=today.getDate()===d&&today.getMonth()===_lc.month&&today.getFullYear()===_lc.year;
    const isSel=selD&&selD.getDate()===d&&selD.getMonth()===_lc.month&&selD.getFullYear()===_lc.year;
    cells+=`<div class="cal-day${isToday?' cal-today':''}${isSel?' cal-sel':''}" onclick="calPickDay(${d},event)">${d}</div>`;
  }
  // Next month lead
  const total=firstDay+daysInMonth;const rem=total%7===0?0:7-(total%7);
  for(let d=1;d<=rem;d++)cells+=`<div class="cal-day cal-other cal-empty">${d}</div>`;
  const dows=DAYS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  popup.innerHTML=`
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calShiftMonth(-1,event)">‹</button>
      <span class="cal-yr-label" onclick="calToggleYears(event)">${MFULL[_lc.month]} ${_lc.year} ▾</span>
      <button class="cal-nav-btn" onclick="calShiftMonth(1,event)">›</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div>
    <button class="cal-clear" onclick="event.stopPropagation();calClearDate()">Clear date</button>`;
}
function renderCalYears(){
  const popup=document.getElementById(_lc.id+'-cal-popup');
  if(!popup)return;
  const cur=new Date().getFullYear();
  let html='';
  for(let y=cur-3;y<=cur+10;y++)html+=`<div class="cal-yr-item${y===_lc.year?' sel':''}" onclick="calPickYear(${y},event)">${y}</div>`;
  popup.innerHTML=`
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calToggleYears(event)">✕</button>
      <span class="cal-yr-label">Select Year</span><span></span>
    </div>
    <div class="cal-yr-grid">${html}</div>`;
}
function calShiftMonth(dir,e){
  if(e)e.stopPropagation();
  _lc.month+=dir;
  if(_lc.month<0){_lc.month=11;_lc.year--;}
  if(_lc.month>11){_lc.month=0;_lc.year++;}
  renderCalPopup();
}
function calToggleYears(e){if(e)e.stopPropagation();_lc.viewMode=_lc.viewMode==='years'?'days':'years';renderCalPopup();}
function calPickYear(y,e){if(e)e.stopPropagation();_lc.year=y;_lc.viewMode='days';renderCalPopup();}
function calPickDay(d,e){
  if(e)e.stopPropagation();
  const dd=String(d).padStart(2,'0');
  const mm=String(_lc.month+1).padStart(2,'0');
  const val=dd+'-'+mm+'-'+_lc.year; // DD-MM-YYYY
  _lc.sel=val;
  const type=_lc.id==='pl'?'personal':'home';
  data[type].startDate=val;
  save();
  const disp=document.getElementById(_lc.id+'-cal-display');
  if(disp){disp.classList.remove('empty');disp.querySelector('span').textContent=formatCalLabel(val);}
  document.getElementById(_lc.id+'-cal-popup').style.display='none';
  renderResults(type);
}
function calClearDate(){
  const type=_lc.id==='pl'?'personal':'home';
  data[type].startDate='';_lc.sel=null;save();
  const disp=document.getElementById(_lc.id+'-cal-display');
  if(disp){disp.classList.add('empty');disp.querySelector('span').textContent='Select date';}
  document.getElementById(_lc.id+'-cal-popup').style.display='none';
  renderResults(type);
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.cal-wrap'))document.querySelectorAll('.cal-popup').forEach(p=>p.style.display='none');
});
function renderLoan(type){renderForm(type);renderResults(type);}

function renderResults(type){
  const d=data[type];
  const P=Number(d.amount||0),annualRate=Number(d.rate||0)/100,tenure=Number(d.tenure||0);
  const prefix=type==='personal'?'pl':'hl';
  const rc=document.getElementById(prefix+'-results-card');
  if(!rc)return;
  if(!P||!annualRate||!tenure){rc.innerHTML='';return}
  const r=annualRate/12;
  const emi=emiCalc(P,annualRate,tenure);
  const totalNopp=emi*tenure,interestNopp=totalNopp-P;
  let bal=P,months=0,totalPaid=0,totalInterest=0;
  const ppSorted=[...d.partPayments].sort((a,b)=>a.month-b.month);
  const yearData=[];
  let yearP=0,yearI=0,newEmi=emi;
  const ppBalanceMap={};
  for(let m=1;m<=tenure*2&&bal>0;m++){
    const intPart=bal*r,prinPart=Math.min(bal,newEmi-intPart);
    bal-=prinPart;totalPaid+=newEmi;totalInterest+=intPart;
    yearP+=prinPart;yearI+=intPart;months=m;
    ppSorted.filter(p=>p.month===m).forEach(p=>{
      const balBefore=bal;
      const ppAmt=Math.min(p.amount,bal);
      bal-=ppAmt;totalPaid+=ppAmt;
      ppBalanceMap[p.id]={balBefore,balAfter:Math.max(0,bal),actualAmt:ppAmt};
      if(p.strategy==='reduce-emi'&&bal>0){const rm=tenure-m;if(rm>0)newEmi=emiCalc(bal,annualRate,rm);}
    });
    if(m%12===0||bal<=0){yearData.push({year:Math.ceil(m/12),principal:yearP,interest:yearI,balance:Math.max(0,bal),emi:newEmi});yearP=0;yearI=0;}
    if(bal<=0)break;
  }
  if(yearP>0||yearI>0)yearData.push({year:yearData.length+1,principal:yearP,interest:yearI,balance:0,emi:newEmi});
  const interestSaved=interestNopp-totalInterest,monthsSaved=tenure-months;
  const hasPP=d.partPayments.length>0;

  // Current month progress — based on First EMI Date
  // First EMI = 07 Jun 2025. EMI day = 7.
  // Today = 20 Mar 2026: monthsElapsed=9, and today(20) >= emiDay(7), so 10th EMI is paid → emisPaid=10
  let currentMonth=null,currentBal=null,emisPaid=0;
  if(d.startDate){
    const firstEMI=parseStartDate(d.startDate);
    if(firstEMI){
      const now=new Date();
      const emiDay=firstEMI.getDate(); // e.g. 7
      const monthsElapsed=(now.getFullYear()-firstEMI.getFullYear())*12+(now.getMonth()-firstEMI.getMonth());
      // If today's date >= EMI day, this month's EMI is already paid → add 1
      const thisMthPaid=now.getDate()>=emiDay?1:0;
      emisPaid=Math.min(Math.max(0,monthsElapsed+thisMthPaid),tenure);
      currentMonth=Math.min(emisPaid+1,tenure);
      if(emisPaid>0&&emisPaid<=tenure){
        // balanceAtMonthWithPP(emisPaid) now runs through month emisPaid's EMI — correct outstanding
        currentBal=balanceAtMonthWithPP(type,emisPaid);
      }
    }
  }

  let html=`<div class="card" style="margin-top:0">`;

  // EMI Hero
  html+=`<div class="result-card">
    <div class="result-label">Monthly EMI</div>
    <div class="result-val">${fmtFull(emi)}</div>
    <div class="result-sub">for ${tenure} months &nbsp;·&nbsp; ${(tenure/12).toFixed(1)} years</div>
  </div>`;

  // ── FIX 5: Current month indicator pill ──
  if(currentMonth!==null&&emisPaid>0&&currentBal!==null){
    const pctDone=Math.round((emisPaid/tenure)*100);
    // Next EMI = first EMI date + emisPaid months (e.g. Jun 2025 + 10 = Apr 2026)
    const nextDueLabel=d.startDate?monthLabel(d.startDate,emisPaid):'';
    html+=`<div style="margin-top:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
        <div style="font-size:0.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px">Loan Progress</div>
        <div style="font-size:0.68rem;font-weight:700;color:var(--text2)">${emisPaid} of ${tenure} EMIs paid &nbsp;·&nbsp; ${pctDone}% done</div>
      </div>
      <div style="height:6px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-bottom:8px">
        <div style="height:100%;width:${pctDone}%;background:var(--blue);border-radius:99px"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:0.62rem;color:var(--text3);margin-bottom:1px">Outstanding now</div>
          <div style="font-size:0.92rem;font-weight:800;color:var(--text1)">${fmtFull(currentBal)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:0.62rem;color:var(--text3);margin-bottom:1px">${nextDueLabel?'Next EMI due':'Remaining'}</div>
          <div style="font-size:0.72rem;font-weight:700;color:var(--blue)">${nextDueLabel||((tenure-emisPaid)+' months left')}</div>
        </div>
      </div>
    </div>`;
  }

  // Summary rows
  html+=`<div style="margin-top:8px">`;
  html+=`<div class="result-row"><span class="result-row-label">Total Payable</span><span class="result-row-val">${fmtFull(totalPaid)}</span></div>`;
  html+=`<div class="result-row"><span class="result-row-label">Total Interest</span><span class="result-row-val" style="color:var(--red)">${fmtFull(totalInterest)}</span></div>`;
  if(hasPP)html+=`<div class="result-row"><span class="result-row-label" style="color:var(--text3)">Original Interest <span style="font-weight:400">(no prepayment)</span></span><span class="result-row-val" style="color:var(--text3)">${fmtFull(interestNopp)}</span></div>`;
  if(interestSaved>0)html+=`<div class="result-row"><span class="result-row-label">Interest Saved</span><span class="result-row-val" style="color:var(--green)">${fmtFull(interestSaved)}</span></div>`;
  if(monthsSaved>0)html+=`<div class="result-row"><span class="result-row-label">Closes Early By</span><span class="result-row-val" style="color:var(--green)">${monthsSaved} months</span></div>`;
  if(newEmi!==emi)html+=`<div class="result-row"><span class="result-row-label">Revised EMI</span><span class="result-row-val" style="color:var(--green)">${fmtFull(newEmi)}</span></div>`;
  html+=`<div class="result-row"><span class="result-row-label">Loan Tenure</span><span class="result-row-val">${tenure} months (${(tenure/12).toFixed(1)}y)</span></div>`;
  if(hasPP&&monthsSaved>0)html+=`<div class="result-row"><span class="result-row-label">Payoff In</span><span class="result-row-val" style="color:var(--green)">${months} months (${(months/12).toFixed(1)}y)</span></div>`;
  html+=`</div>`;

  // Part Payments section
  const ppCount=d.partPayments.length;
  const maxPP=2;
  html+=`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border2)">`;
  html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;cursor:pointer;user-select:none" onclick="togglePPSection('${prefix}')">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="font-size:0.82rem;font-weight:700;color:var(--text1)">Part Payments <span style="font-size:0.68rem;font-weight:500;color:var(--text3)">(${ppCount}/${maxPP})</span></div>
      <svg id="${prefix}-pp-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;color:var(--text3);transition:transform 0.25s;flex-shrink:0"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    ${ppCount<maxPP
      ?`<button class="btn btn-ghost" style="padding:6px 12px;font-size:0.72rem" onclick="event.stopPropagation();showAddPP('${type}')">Add</button>`
      :`<span style="font-size:0.68rem;color:var(--text3);padding:4px 8px">Max 2 reached</span>`}
  </div>`;

  // ── FIX 3: PP impact summary banner ──
  if(hasPP&&(interestSaved>0||monthsSaved>0)){
    html+=`<div style="margin-top:8px;padding:9px 12px;background:var(--green-bg);border:1px solid rgba(34,197,94,0.2);border-radius:var(--r);display:flex;align-items:center;gap:10px">
      <span style="font-size:1rem;flex-shrink:0">🎯</span>
      <div style="font-size:0.72rem;font-weight:600;color:var(--green);line-height:1.5">
        ${interestSaved>0?`You save <strong>${fmt(interestSaved)}</strong> in interest`:''}${interestSaved>0&&monthsSaved>0?' and ':' '}${monthsSaved>0?`close <strong>${monthsSaved} months early</strong>`:''}
      </div>
    </div>`;
  }

  html+=`<div id="${prefix}-pp-body" style="margin-top:8px">`;
  html+=`<div style="font-size:0.68rem;color:var(--text3);margin-bottom:8px;padding:6px 10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border2)">
    <span style="color:#fbbf24">ⓘ</span> Bank rule: allowed after 12 EMIs · max 25% of outstanding · 2 times per tenure
  </div>`;

  if(hasPP){
    html+=`<div class="pp-list">`;
    d.partPayments.sort((a,b)=>a.month-b.month).forEach(pp=>{
      const ppInfo=ppBalanceMap[pp.id];
      const outstandingAfter=ppInfo?ppInfo.balAfter:null;
      const calLabel=monthLabel(d.startDate,pp.month);
      const balBefore=ppInfo?ppInfo.balBefore:0;
      const maxAllowed=Math.floor(balBefore*0.25);
      const violates25=pp.amount>maxAllowed&&balBefore>0;
      const violates12=pp.month<=12;
      const hasViolation=violates12||violates25;
      // ── FIX 1: stronger violation border styling ──
      html+=`<div class="pp-item">
        <div class="pp-info">
          <div class="pp-amt">${fmt(pp.amount)} <span style="color:var(--text3);font-weight:500;font-size:0.82rem">at month ${pp.month}${calLabel?` <span style="color:var(--blue)">(${calLabel})</span>`:''}</span></div>
          <div class="pp-meta">${pp.strategy==='reduce-tenure'?'↓ Reduce tenure':'↓ Reduce EMI'}</div>
          ${violates12?`<div style="font-size:0.68rem;font-weight:600;color:var(--red);margin-top:5px;padding:4px 8px;background:var(--red-bg);border-radius:6px;display:inline-block">⚠ Must be after month 12</div>`:''}
          ${violates25&&!violates12?`<div style="font-size:0.68rem;font-weight:600;color:var(--red);margin-top:5px;padding:4px 8px;background:var(--red-bg);border-radius:6px;display:inline-block">⚠ Exceeds 25% limit · max ${fmt(maxAllowed)}</div>`:''}
          ${outstandingAfter!==null?`
          <div class="pp-outstanding" style="margin-top:8px;padding-top:8px">
            <span style="font-size:0.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px">Balance after prepayment</span>
            <span style="font-size:0.92rem;font-weight:800;color:var(--text1);margin-left:8px">${fmtFull(outstandingAfter)}</span>
          </div>`:''}
        </div>
        <div class="pp-actions" style="margin-top:2px">
          <button class="pp-edit" onclick="editPP('${type}','${pp.id}')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="pp-del" onclick="removePP('${type}','${pp.id}')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
      <div class="pp-edit-form" id="pp-ef-${pp.id}" style="display:none">
        <div class="fg"><label class="fl">Amount (₹)</label><input class="fi" id="pp-ea-${pp.id}" type="number" inputmode="numeric" value="${pp.amount}"/></div>
        <div class="fg"><label class="fl">At Month</label><input class="fi" id="pp-em-${pp.id}" type="number" inputmode="numeric" value="${pp.month}"/></div>
        <div class="fl" style="margin-bottom:6px">After Part Payment</div>
        <div class="radio-pills">
          <button class="radio-pill ${pp.strategy==='reduce-tenure'?'active':''}" id="pp-es-ten-${pp.id}" onclick="setEditStrategy('${pp.id}','reduce-tenure')">Reduce Tenure</button>
          <button class="radio-pill ${pp.strategy==='reduce-emi'?'active':''}" id="pp-es-emi-${pp.id}" onclick="setEditStrategy('${pp.id}','reduce-emi')">Reduce EMI</button>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <button class="btn btn-ghost" style="padding:7px 14px;font-size:0.78rem" onclick="cancelEditPP('${pp.id}')">Cancel</button>
          <button class="btn btn-primary" style="padding:7px 14px;font-size:0.78rem" onclick="saveEditPP('${type}','${pp.id}')">Save</button>
        </div>
      </div>`;
    });
    html+=`</div>`;
  } else {
    html+=`<div style="font-size:0.72rem;color:var(--text3);padding:8px 0">No part payments added yet.</div>`;
  }
  html+=`</div>`; // close pp-body
  html+=`</div>`; // close section wrapper

  // Add PP form (outside collapse so it can slide in independently)
  html+=`<div id="${prefix}-pp-form" style="display:none;margin-top:10px;padding:12px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r)">
    <div id="${prefix}-pp-suggestion" style="display:none;margin-bottom:12px"></div>
    <div class="fg"><label class="fl">Part Payment Amount (₹)</label>
      <input class="fi" id="${prefix}-pp-amt" type="number" inputmode="numeric" placeholder="e.g. 100000" oninput="updatePPHint('${type}','${prefix}')"/>
      <div id="${prefix}-pp-amt-hint" style="font-size:0.65rem;margin-top:4px"></div>
    </div>
    <div class="fg"><label class="fl">At Month Number <span style="font-weight:400">(must be > 12)</span></label>
      <input class="fi" id="${prefix}-pp-month" type="number" inputmode="numeric" placeholder="e.g. 13" oninput="updatePPHint('${type}','${prefix}')"/>
      <div id="${prefix}-pp-month-hint" style="font-size:0.65rem;margin-top:4px"></div>
    </div>
    <div class="fl" style="margin-bottom:6px">After Part Payment</div>
    <div class="radio-pills">
      <button class="radio-pill active" id="${prefix}-pp-str-tenure" onclick="setPPStrategy('${prefix}','reduce-tenure')">Reduce Tenure</button>
      <button class="radio-pill" id="${prefix}-pp-str-emi" onclick="setPPStrategy('${prefix}','reduce-emi')">Reduce EMI</button>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-ghost" style="padding:8px 14px;font-size:0.78rem" onclick="hideAddPP('${prefix}')">Cancel</button>
      <button class="btn btn-primary" style="padding:8px 14px;font-size:0.78rem" onclick="addPP('${type}','${prefix}')">Add</button>
    </div>
  </div>`;

  // Amortization card rows
  html+=`<div class="yr-table-wrap">
    <button class="yr-toggle" onclick="toggleYr(this,'${prefix}-tb')">
      <span>Amortization Schedule</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div id="${prefix}-tb" class="yr-body closed">
      <div class="yr-cards">
        <div class="yr-hdr">
          <div class="yr-hdr-cell">Yr</div>
          <div class="yr-hdr-cell">Principal</div>
          <div class="yr-hdr-cell">Interest</div>
          <div class="yr-hdr-cell">Balance</div>
        </div>
        ${(()=>{
          let rows='';
          yearData.forEach(y=>{
            const yearStart=(y.year-1)*12+1;
            const yearEnd=y.year*12;
            const yearPPs=ppSorted.filter(p=>p.month>=yearStart&&p.month<=yearEnd);
            const ppTag=yearPPs.length>0
              ?`<span style="font-size:0.58rem;font-weight:700;color:var(--blue);background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.25);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle">PP</span>`
              :'';
            rows+=`<div class="yr-row">
              <div class="yr-cell" style="display:flex;align-items:center">${y.year}${ppTag}</div>
              <div class="yr-cell">${fmt(y.principal)}</div>
              <div class="yr-cell" style="color:var(--red)">${fmt(y.interest)}</div>
              <div class="yr-cell">${fmt(y.balance)}</div>
            </div>`;
          });
          return rows;
        })()}
      </div>
    </div>
  </div>`;

  html+=`<div class="info-note"><span style="opacity:0.5">ⓘ</span><span>Part payments reduce outstanding principal. Choose "Reduce Tenure" to close loan early, or "Reduce EMI" to lower monthly burden.</span></div>`;

  if(hasPP){
    const ppSummaryRows=ppSorted.map((pp,i)=>{
      const ppInfo=ppBalanceMap[pp.id];
      if(!ppInfo)return'';
      const calLbl=d.startDate?monthLabel(d.startDate,pp.month):'Month '+pp.month;
      return`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;${i<ppSorted.length-1?'border-bottom:1px solid var(--border2)':''}">
        <div>
          <div style="font-size:0.78rem;font-weight:700;color:var(--text1)">Prepayment ${i+1} &nbsp;<span style="font-weight:500;color:var(--blue);font-size:0.72rem">${calLbl}</span></div>
          <div style="font-size:0.68rem;color:var(--text3);margin-top:2px">Before: ${fmtFull(ppInfo.balBefore)} &nbsp;→&nbsp; Paid: ${fmtFull(ppInfo.actualAmt)}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div style="font-size:0.68rem;color:var(--text3)">Balance after</div>
          <div style="font-size:0.88rem;font-weight:800;color:var(--text1)">${fmtFull(ppInfo.balAfter)}</div>
        </div>
      </div>`;
    }).join('');
    html+=`<div style="margin-top:8px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r)">
      <div style="font-size:0.62rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px">Prepayment Summary</div>
      ${ppSummaryRows}
    </div>`;
  }

  html+=`</div>`;
  rc.innerHTML=html;
}

function togglePPSection(prefix){
  const body=document.getElementById(prefix+'-pp-body');
  const caret=document.getElementById(prefix+'-pp-caret');
  if(!body)return;
  const isHidden=body.style.display==='none';
  body.style.display=isHidden?'block':'none';
  if(caret)caret.style.transform=isHidden?'':'rotate(180deg)';
}
function showAddPP(type){
  const p=type==='personal'?'pl':'hl';
  document.getElementById(p+'-pp-form').style.display='';

  const d=data[type];
  const P=Number(d.amount||0),annualRate=Number(d.rate||0)/100,tenure=Number(d.tenure||0);
  if(!P||!annualRate||!tenure){updatePPHint(type,p);return;}

  // Always clear fields on open so suggestion is always fresh
  const amtEl=document.getElementById(p+'-pp-amt');
  const monthEl=document.getElementById(p+'-pp-month');
  if(amtEl) amtEl.value='';
  if(monthEl) monthEl.value='';

  const ppSorted=[...d.partPayments].sort((a,b)=>a.month-b.month);
  const usedMonths=new Set(ppSorted.map(x=>x.month));

  // Suggest month:
  // - 1st PP → month 13 (earliest eligible)
  // - 2nd PP → 12 months after the 1st PP (bank allows once per year), min month 13
  let sugMonth;
  if(ppSorted.length===0){
    sugMonth=13;
  } else {
    const lastPPMonth=ppSorted[ppSorted.length-1].month;
    sugMonth=Math.max(13, lastPPMonth+12);
    // If that month is already used, advance by 1
    while(usedMonths.has(sugMonth)&&sugMonth<tenure) sugMonth++;
  }
  sugMonth=Math.min(sugMonth,tenure-1); // can't be last month

  // Balance AFTER sugMonth's EMI (accounting for any prior PPs)
  const bal=balanceAtMonthWithPP(type,sugMonth);
  const sugAmt=Math.floor(bal*0.25);

  // Pre-fill fields
  if(amtEl) amtEl.value=sugAmt>0?sugAmt:'';
  if(monthEl) monthEl.value=sugMonth;

  // Render suggestion chip
  const sugBox=document.getElementById(p+'-pp-suggestion');
  if(sugBox&&bal>0){
    const calLbl=d.startDate?` · <span style="color:var(--blue)">${monthLabel(d.startDate,sugMonth)}</span>`:'';

    // For 2nd PP: show context — balance after 1st PP effect + EMIs since
    const priorPP=ppSorted.length>0?ppSorted[ppSorted.length-1]:null;
    const priorContext=priorPP
      ?`<div style="font-size:0.65rem;color:var(--text3);margin-bottom:6px;padding:5px 8px;background:var(--surface2);border-radius:6px">After 1st prepayment + ${sugMonth-priorPP.month} more EMIs · balance: <strong style="color:var(--text1)">₹${Math.round(bal).toLocaleString('en-IN')}</strong></div>`
      :'';

    sugBox.style.display='';
    sugBox.innerHTML=`<div style="background:rgba(59,130,246,0.07);border:1px solid rgba(59,130,246,0.2);border-radius:10px;padding:10px 12px">
      <div style="font-size:0.62rem;font-weight:700;color:var(--blue);letter-spacing:0.3px;margin-bottom:6px;text-transform:uppercase">Suggested Part Payment</div>
      ${priorContext}
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div>
          <div style="font-size:0.92rem;font-weight:800;color:var(--text1)">₹${sugAmt.toLocaleString('en-IN')}</div>
          <div style="font-size:0.65rem;color:var(--text3);margin-top:2px">25% of ₹${Math.round(bal).toLocaleString('en-IN')} (after EMI ${sugMonth})${calLbl}</div>
        </div>
        <button id="${p}-pp-use-btn" onclick="applyPPSuggestion('${p}','${type}',${sugAmt},${sugMonth})" style="font-size:0.7rem;font-weight:700;padding:5px 12px;border-radius:8px;border:1px solid rgba(59,130,246,0.35);background:rgba(59,130,246,0.12);color:var(--blue);cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;display:none">Use this</button>
      </div>
    </div>`;
    sugBox.dataset.sugAmt=sugAmt;
    sugBox.dataset.sugMonth=sugMonth;
  }

  updatePPHint(type,p);
}

function applyPPSuggestion(prefix,type,amt,month){
  const amtEl=document.getElementById(prefix+'-pp-amt');
  const monthEl=document.getElementById(prefix+'-pp-month');
  if(amtEl)amtEl.value=amt;
  if(monthEl)monthEl.value=month;
  updatePPHint(type,prefix);
}
function _syncUseThisBtn(prefix){
  const sugBox=document.getElementById(prefix+'-pp-suggestion');
  const btn=document.getElementById(prefix+'-pp-use-btn');
  if(!sugBox||!btn)return;
  const sugAmt=Number(sugBox.dataset.sugAmt||0);
  const sugMonth=Number(sugBox.dataset.sugMonth||0);
  const curAmt=Number(document.getElementById(prefix+'-pp-amt')?.value||0);
  const curMonth=Number(document.getElementById(prefix+'-pp-month')?.value||0);
  // Show "Use this" only when user has changed the fields away from the suggestion
  btn.style.display=(curAmt!==sugAmt||curMonth!==sugMonth)?'':'none';
}
function updatePPHint(type,prefix){
  const monthEl=document.getElementById(prefix+'-pp-month');
  const amtEl=document.getElementById(prefix+'-pp-amt');
  const monthHint=document.getElementById(prefix+'-pp-month-hint');
  const amtHint=document.getElementById(prefix+'-pp-amt-hint');
  if(!monthEl||!amtEl||!monthHint||!amtHint)return;
  const month=Number(monthEl.value||0);
  const amt=Number(amtEl.value||0);
  const d=data[type];
  // Month hint
  if(month>0&&month<=12){
    monthHint.style.color='var(--red)';
    monthHint.textContent='⚠ Must be after month 12 (first 12 EMIs must complete)';
  } else if(month>12&&d.startDate){
    monthHint.style.color='var(--blue)';
    monthHint.textContent='📅 EMI due '+monthLabel(d.startDate,month);
  } else {
    monthHint.textContent='';
  }
  // Amount hint — show balance and max 25%
  if(month>12){
    const bal=balanceAtMonthWithPP(type,month);
    const maxAmt=Math.floor(bal*0.25);
    if(bal>0){
      if(amt>maxAmt&&amt>0){
        amtHint.style.color='var(--red)';
        amtHint.textContent=`⚠ Exceeds 25% limit. Max: ${fmt(maxAmt)} (balance: ${fmt(bal)})`;
      } else {
        amtHint.style.color='var(--text3)';
        amtHint.textContent=`Balance at month ${month}: ${fmt(bal)} · Max 25%: ${fmt(maxAmt)}`;
      }
    }
  } else {
    amtHint.textContent='';
  }
  _syncUseThisBtn(prefix);
}
function hideAddPP(prefix){document.getElementById(prefix+'-pp-form').style.display='none'}
function setPPStrategy(prefix,strategy){
  document.getElementById(prefix+'-pp-str-tenure').classList.toggle('active',strategy==='reduce-tenure');
  document.getElementById(prefix+'-pp-str-emi').classList.toggle('active',strategy==='reduce-emi');
  document.getElementById(prefix+'-pp-form').dataset.strategy=strategy;
}
function addPP(type,prefix){
  const amt=Number(document.getElementById(prefix+'-pp-amt').value||0);
  const month=Number(document.getElementById(prefix+'-pp-month').value||0);
  const strategy=document.getElementById(prefix+'-pp-form').dataset?.strategy||'reduce-tenure';
  if(!amt||!month)return;
  if(month<=12){alert('Part payment must be after month 12 (after completing 12 EMIs).');return;}
  if(data[type].partPayments.length>=2){alert('Banks allow maximum 2 part payments during the entire loan tenure.');return;}
  const bal=balanceAtMonthWithPP(type,month);
  const maxAmt=Math.floor(bal*0.25);
  if(bal>0&&amt>maxAmt){
    if(!confirm(`Amount exceeds 25% of outstanding (max ${fmt(maxAmt)}). Add anyway?`))return;
  }
  data[type].partPayments.push({id:uid(),amount:amt,month,strategy});
  save();renderResults(type);
}
function removePP(type,id){data[type].partPayments=data[type].partPayments.filter(p=>p.id!==id);save();renderResults(type);}
function editPP(type,id){
  document.querySelectorAll('.pp-edit-form').forEach(el=>el.style.display='none');
  const ef=document.getElementById('pp-ef-'+id);if(ef)ef.style.display='';
}
function cancelEditPP(id){const ef=document.getElementById('pp-ef-'+id);if(ef)ef.style.display='none';}
function setEditStrategy(id,strategy){
  document.getElementById('pp-es-ten-'+id)?.classList.toggle('active',strategy==='reduce-tenure');
  document.getElementById('pp-es-emi-'+id)?.classList.toggle('active',strategy==='reduce-emi');
  const ef=document.getElementById('pp-ef-'+id);if(ef)ef.dataset.strategy=strategy;
}
function saveEditPP(type,id){
  const amt=Number(document.getElementById('pp-ea-'+id)?.value||0);
  const month=Number(document.getElementById('pp-em-'+id)?.value||0);
  const ef=document.getElementById('pp-ef-'+id);
  const strategy=ef?.dataset?.strategy||(data[type].partPayments.find(p=>p.id===id)?.strategy)||'reduce-tenure';
  if(!amt||!month)return;
  const pp=data[type].partPayments.find(p=>p.id===id);
  if(pp){pp.amount=amt;pp.month=month;pp.strategy=strategy;}
  save();renderResults(type);
}

(function(){
  load();
  const t=localStorage.getItem('loan_theme'),tgl=document.getElementById('theme-toggle');
  if(t){document.body.setAttribute('data-theme',t);if(tgl)tgl.checked=t==='dark'}
  else if(matchMedia('(prefers-color-scheme:light)').matches){document.body.setAttribute('data-theme','light');if(tgl)tgl.checked=false}
  else{if(tgl)tgl.checked=true}
  setFontSize(Number(localStorage.getItem('loan_fs'))||16);
  renderLoan('personal');renderLoan('home');
})();
</script>
